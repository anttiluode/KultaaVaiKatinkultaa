name: Native GN experiments
on:
  push:
  pull_request:
jobs:
  science:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python experiments/kultaa.py --output results/latest.json
      - run: python experiments/stress.py results/stress.json
      - run: python experiments/phase.py | tee results/phase.json
      - run: python experiments/one_wire.py --exhaustive --output results/one_wire.json
      - run: node --check lab.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_native.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-results
          path: |
            results/latest.json
            results/stress.json
            results/phase.json
            results/one_wire.json
